# ╔══════════════════════════════════════╗
# ║         HYPRLAND KEYBINDINGS          ║
# ║  Translated from keybinds.lua (HyprMod)║
# ╚══════════════════════════════════════╝
$mainMod = SUPER

# ── Core ──────────────────────────────────────────────────────────────
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod ALT, RETURN, exec, paplay --volume=32768 ~/.config/hypr/config_Kitty-Efeckt_rezero_death.mp3 & kitty
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exec, hyprctl dispatch exit
bind = $mainMod, T, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod ALT, H, swapwindow, l
bind = $mainMod ALT, J, swapwindow, d
bind = $mainMod ALT, K, swapwindow, u
bind = $mainMod ALT, L, swapwindow, r
# bind = $mainMod, TAB, hyprexpo:expo, toggle   # needs hyprexpo plugin (install via hyprpm)

# ── Special workspaces ────────────────────────────────────────────────
bind = $mainMod, COMMA, togglespecialworkspace, notes
bind = $mainMod, PERIOD, togglespecialworkspace, term
bind = $mainMod, SLASH, togglespecialworkspace, browser
bind = $mainMod SHIFT, COMMA, movetoworkspacesilent, special:notes
bind = $mainMod SHIFT, PERIOD, movetoworkspacesilent, special:term
bind = $mainMod SHIFT, SLASH, movetoworkspacesilent, special:browser

# ── Applications ──────────────────────────────────────────────────────
bind = $mainMod, E, exec, thunar
bind = $mainMod, B, exec, zen-browser
bind = $mainMod, V, exec, code
bind = $mainMod, C, exec, cursor
bind = $mainMod, A, exec, close_all_windows
bind = $mainMod SHIFT, Q, exec, ~/.local/bin/killall

# ── Launchers & Menus ─────────────────────────────────────────────────
bind = $mainMod, SPACE, exec, pkill rofi || launcher
bind = $mainMod, P, exec, pkill rofi || battery
bind = $mainMod, W, exec, pkill rofi || wallset
bind = $mainMod ALT, W, exec, pkill rofi || wallset-dark
bind = $mainMod SHIFT, W, exec, pkill rofi || waybar-menu
bind = $mainMod SHIFT, S, exec, pkill rofi || ~/.config/rofi/applets/bin/powermenu.sh
bind = $mainMod SHIFT, E, exec, rofimoji
bind = $mainMod SHIFT, F, exec, pkill rofi || focus-menu

# ── Layout (Dwindle) ──────────────────────────────────────────────────
bind = $mainMod, J, layoutmsg, swapsplit

# ── Move window ───────────────────────────────────────────────────────
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# ── Workspaces (1-10; key 0 = workspace 10) ───────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ── Move & Resize with mouse ──────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── System ────────────────────────────────────────────────────────────
bind = $mainMod, R, exec, pkill waybar; waybar &
bind = $mainMod SHIFT, R, exec, wallset-backend-startup
bind = $mainMod ALT, R, exec, wallset-dark-backend-startup
bind = $mainMod SHIFT, C, exec, colorscheme-set
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, S, exec, toggle-hyprsunset

# ── Screenshots ───────────────────────────────────────────────────────
bind = , Print, exec, bash -c 'grim "$HOME/Pictures/screenshot_$(date +%Y-%m-%d_%H-%M-%S).png" && notify-send "Screenshot saved!" "Saved to ~/Pictures"'
bind = CTRL, Print, exec, bash -c 'grim -g "$(slurp)" "$HOME/Pictures/screenshot_$(date +%Y-%m-%d_%H-%M-%S).png" && notify-send "Area screenshot saved!" "Saved to ~/Pictures"'
bind = ALT, Print, exec, bash -c 'FILE="$HOME/Pictures/screenshot_$(date +%Y-%m-%d_%H-%M-%S).png"; grim -g "$(slurp)" "$FILE" && swappy -f "$FILE" -o "$FILE"'

# ── Audio ─────────────────────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl = , XF86AudioMute, exec, pamixer -t

# ── Brightness ────────────────────────────────────────────────────────
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
