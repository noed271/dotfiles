# Monitor config
# MacBook Pro 11,1 internal Retina panel: 2560x1600 @ ~224 DPI.
# scale 1.6 -> logical 1600x1000 (exact integer pixels, no fractional blur).
# Bump to 2.0 if still too small, or 1.25 for more screen space.
monitor = eDP-1, 2560x1600@60, 0x0, 1.6

# Fallback for any external/unknown display.
monitor = , preferred, auto, 1
