# ╔══════════════════════════════════════╗
# ║        HYPRLAND MAIN CONFIG           ║
# ║  Repaired for stock Hyprland          ║
# ╚══════════════════════════════════════╝

# ── Sources ───────────────────────────────────────────────────────────
source = ~/.config/hypr/colors/colors.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf
source = ~/.config/hypr/configurations/keybinds.conf

# ── Autostart ─────────────────────────────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-kde-authentication-agent-1
# gnome-keyring is not installed. To enable secrets/keyring: sudo pacman -S gnome-keyring
# exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets
# Wallpaper daemon (awww-daemon). wallset/wallset-backend set the wallpaper via swww→awww; matugen handles colors.
exec-once = awww-daemon
# Bars / notifications / applets
exec-once = waybar
exec-once = swaync
# nm-applet tray icon replaced by the styled Waybar #network pill (click it to open nm-connection-editor)
# exec-once = nm-applet --indicator
exec-once = hypridle
# Japanese (and other) input method — fcitx5 with mozc engine
exec-once = fcitx5 -d --replace
# Night color temperature — reads ~/.config/hypr/hyprsunset.conf (time-based profiles)
exec-once = hyprsunset

# ── Environment Variables ─────────────────────────────────────────────
# ~/.local/bin holds custom commands (launcher, battery, wallset, ...).
# .bashrc adds it to PATH but isn't read by the graphical session, so set it here.
env = PATH,$HOME/.local/bin:$PATH
env = XCURSOR_THEME, breeze
env = XCURSOR_SIZE,  24
env = XDG_MENU_PREFIX, arch-
env = QT_QPA_PLATFORMTHEME, kde
# ── Input method (fcitx5) ─────────────────────────────────────────────
env = GTK_IM_MODULE, fcitx
env = QT_IM_MODULE,  fcitx
env = XMODIFIERS,    @im=fcitx
env = SDL_IM_MODULE, fcitx
# kitty/glfw apps talk to fcitx5 over the ibus protocol:
env = GLFW_IM_MODULE, ibus
# KVM / software rendering fallback
env = WLR_NO_HARDWARE_CURSORS,      1
env = WLR_RENDERER_ALLOW_SOFTWARE,  1

# ── Input ─────────────────────────────────────────────────────────────
input {
    kb_layout  = us
    kb_options = compose:ralt
    follow_mouse = 1
    sensitivity  = 0
    touchpad {
        natural_scroll = true
        # MacBook (bcm5974) has no physical right button:
        tap-to-click = true          # tap with 1 finger = left click
        tap_button_map = lrm         # 2-finger tap = right, 3-finger tap = middle
        clickfinger_behavior = true  # physical 2-finger click = right, 3-finger = middle
    }
}

# ── General ───────────────────────────────────────────────────────────
general {
    gaps_in  = 4
    gaps_out = 12
    layout   = dwindle
    # border colors come from colors.conf ($primary / $surface)
    col.active_border   = $primary
    col.inactive_border = $surface
}

# ── Decoration ────────────────────────────────────────────────────────
decoration {
    rounding         = 12
    active_opacity   = 0.95
    inactive_opacity = 0.86
    blur {
        enabled           = true
        size              = 2
        passes            = 3
        new_optimizations = true
    }
    shadow {
        enabled       = true
        range         = 14
        render_power  = 4
        offset        = 1 2
    }
}

# ── Animations ────────────────────────────────────────────────────────
animations {
    enabled = true
    bezier = overshoot, 0, 1.6, 0.28, 1
    bezier = smooth,    0.4, 0, 0.2, 1
    animation = layers,     1, 5, smooth, fade
    animation = windows,    1, 4, overshoot, slide
    animation = workspaces, 1, 4, smooth, slidefade 90%
}

# ── Layout ────────────────────────────────────────────────────────────
dwindle {
    preserve_split = true
}

# ── Misc ──────────────────────────────────────────────────────────────
misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    vrr = 0
}

# ── Gestures ──────────────────────────────────────────────────────────
gesture = 3, horizontal, workspace

# ── Layer Rules ───────────────────────────────────────────────────────
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.7, match:namespace rofi
layerrule = blur on, match:namespace waybar
layerrule = animation slide, match:namespace swaync-notification-window
layerrule = animation slide, match:namespace swaync-control-center

# ── Window Rules ──────────────────────────────────────────────────────
windowrule = float on, match:class ^(DesktopEditors)$
windowrule = center on, match:class ^(DesktopEditors)$

# NOTE: The hyprexpo plugin block from the original config was removed.
# To use it, install via: hyprpm add https://github.com/hyprwm/hyprland-plugins
# then re-enable the SUPER+TAB bind in configurations/keybinds.conf.

# ── Mode system (Normal / Focus / Zen) ────────────────────────────────
# Switched by ~/.local/bin/focus-mode via the SUPER+SHIFT+F menu (focus-menu).
# current-mode.conf is an UNTRACKED file (gitignored) that focus-mode rewrites
# to `source = <mode>.conf`; sourced last so the active mode overrides the
# inline blocks above. install.sh seeds it to Normal if absent.
source = ~/.config/hypr/current-mode.conf
